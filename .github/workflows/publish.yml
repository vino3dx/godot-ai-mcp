name: Publish to npm

on:
  release:
    types: [published]      # 自动：发布 GitHub Release 时触发
  workflow_dispatch:        # 手动：可以在 Actions 页面点 Run workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm run build

      - run: npm publish --provenance
